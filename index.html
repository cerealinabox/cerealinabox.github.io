<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0B1220">
<title>Children's Emergency — Journey narrative</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#142238;
  --now:#F4A417;
  --font-body:'IBM Plex Sans',system-ui,-apple-system,sans-serif;
  --font-mono:'IBM Plex Mono',ui-monospace,SFMono-Regular,monospace;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{
  font-family:var(--font-body);
  background:radial-gradient(120% 90% at 50% 0%,#20304A 0%,#0B1220 62%);
  color:var(--ink);line-height:1.5;font-size:16px;
  min-height:100vh;overflow-x:hidden;overflow-y:auto;
}
button{font:inherit;color:inherit;background:none;border:none;cursor:pointer}
.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

/* ---------- single-column stage: narrative only ---------- */
.stage{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:48px 32px;box-sizing:border-box;}
.narrative{width:min(620px,92vw);flex-shrink:0;}
.narr-photo-wrap{position:relative;width:100%;aspect-ratio:16/9;border-radius:18px;overflow:hidden;background:#0F1826;box-shadow:0 24px 60px rgba(0,0,0,.5),inset 0 0 0 1px rgba(255,255,255,.06);}
.narr-photo{width:100%;height:100%;object-fit:cover;display:block;transition:opacity .35s ease;}
.narr-photo-ph{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:#6B7A90;font-family:var(--font-mono);font-size:12px;letter-spacing:.06em;padding:20px;text-align:center;}
.narr-body{margin-top:22px;}
.narr-step{display:block;font-family:var(--font-mono);font-size:11px;font-weight:600;letter-spacing:.15em;text-transform:uppercase;color:var(--now);}
.narr-text{margin-top:12px;font-size:16.5px;line-height:1.62;color:#E9EEF4;font-weight:400;}

/* ---------- narrative controls ---------- */
.controls{margin-top:26px;display:flex;align-items:center;gap:7px;background:var(--ink);border-radius:99px;padding:7px;box-shadow:0 12px 34px rgba(20,34,56,.42)}
.ctrl{border-radius:99px;padding:0 16px;min-height:42px;font-weight:600;font-size:14.5px;white-space:nowrap;background:rgba(255,255,255,.15);color:#fff;transition:opacity .18s,background .18s}
.ctrl:disabled{opacity:.28;cursor:not-allowed}
.ctrl.primary{background:var(--now);color:#3A2A00}
.ctrl.primary:disabled{background:rgba(255,255,255,.15);color:#fff}
.ctrl:focus-visible{outline:2px solid var(--now);outline-offset:2px}
.ctrl-hint{flex:1;min-width:0;text-align:center;font-size:10.5px;font-weight:500;line-height:1.25;color:rgba(255,255,255,.62)}

@media(max-width:920px){
  .stage{padding:24px 16px;}
  .narr-text{font-size:15.5px;}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>

<div class="stage">

<aside class="narrative" id="narrative">
  <div class="narr-photo-wrap">
    <img class="narr-photo" id="narrPhoto" alt="" src="assets/photo0.jpg" onerror="this.style.opacity=0;var p=document.getElementById('narrPhotoPh');if(p)p.hidden=false;">
    <span class="narr-photo-ph" id="narrPhotoPh" hidden></span>
  </div>
  <div class="narr-body">
    <span class="narr-step" id="narrStep"></span>
    <p class="narr-text" id="narrText"></p>
  </div>

  <div class="controls">
    <button class="ctrl" id="btnBack">Back</button>
    <span class="ctrl-hint" id="ctrlHint"></span>
    <button class="ctrl primary" id="btnNext">Next</button>
  </div>
</aside>

</div>

<script>
/* Narrative frames. Photos live in assets/photo0.jpg … photo8.jpg
   Stage 0 uses photo0; Scenes 1–8 keep their original photo1–photo8. */
const NARR = [
 {n:'Stage 0', label:'Caregiver & Child', photo:0, text:'It is 8:00 a.m. when you and your child arrive at KKH Children\u2019s Emergency after your child has been vomiting for the past four hours. Your child looks weak, uneasy, and uncomfortable.'},
 {n:'Scene 1', label:'Arrival screening', photo:1, text:'At the entrance, you and your child join a short queue to answer screening questions about recent travel to countries with contagious diseases. The process takes about 15 minutes while your child waits anxiously.'},
 {n:'Scene 2', label:'Triage waiting', photo:2, text:'You and your child enter Children\u2019s Emergency and get a queue number. You wait about 45 minutes to be seen by a triage nurse. During this time, your child remains uneasy and vomits on and off.'},
 {n:'Scene 3', label:'Payment and first vomit', photo:3, text:'After triage, the nurse says your child does not need immediate admission and should proceed to payment before seeing a doctor. While waiting at the counter, your child vomits on the floor for the first time in the department. The nurses hand over a bag, and you complete payment after 15 to 20 minutes.'},
 {n:'Scene 4', label:'Doctor wait', photo:4, text:'You and your child move to the waiting area, where many sick children are also waiting. The estimated wait time is around three hours. About 1 hour and 45 minutes later, your child is finally seen by a doctor, who recommends a blood test.'},
 {n:'Scene 5', label:'Blood test delay', photo:5, text:'You go back out and wait again with your child. Your child vomits once more while waiting. After about 45 minutes, your child\u2019s blood is drawn, and then you wait another hour for the results.'},
 {n:'Scene 6', label:'Diagnosis and admission', photo:6, text:'The results show that your child has a severe rotavirus infection. The doctor says your child needs to be admitted and gives anti-nausea medicine for now. You receive a letter and walk with your child to the emergency pharmacy and admissions area.'},
 {n:'Scene 7', label:'Admission wait', photo:7, text:'The area is crowded, hot, and hard to move through. There are not enough seats, so you wait outside while watching for your queue number to be called. About 25 minutes later, you are called to the counter, check your child in, receive a tag, and get briefed while standing.'},
 {n:'Scene 8', label:'Bed assignment', photo:8, text:'You ask whether you can go get food because you are really hungry, and you are told you will be called on the phone. But when you return 45 minutes later, your number has already been called without you hearing it. You go back to the counter, confirm that your child\u2019s bed is ready, and wait for a porter to bring you both up to the ward.'}
];
let narr = 0;

function renderNarrative(){
  const f = NARR[narr];
  const img = document.getElementById('narrPhoto');
  const ph = document.getElementById('narrPhotoPh');
  if(img){
    const src = 'assets/photo' + f.photo + '.jpg';
    if(img.getAttribute('src') !== src){
      img.style.opacity = 0;
      img.onload = ()=>{ img.style.opacity = 1; if(ph) ph.hidden = true; };
      img.onerror = ()=>{ img.style.opacity = 0; if(ph){ ph.hidden = false; ph.textContent = 'Photo ' + f.photo + ' (add assets/photo' + f.photo + '.jpg)'; } };
      img.src = src;
    }
  }
  const step = document.getElementById('narrStep');
  const text = document.getElementById('narrText');
  if(step) step.textContent = f.n + ' \u00B7 ' + f.label;
  if(text) text.innerHTML = f.text;

  document.getElementById('btnBack').disabled = narr === 0;
  document.getElementById('btnNext').disabled = narr === NARR.length - 1;
  document.getElementById('ctrlHint').textContent =
    (narr + 1) + ' of ' + NARR.length + (narr === NARR.length - 1 ? ' \u00B7 End of the journey' : '');
}

function go(delta){
  const n = narr + delta;
  if(n < 0 || n > NARR.length - 1) return;
  narr = n;
  renderNarrative();
}

document.getElementById('btnBack').addEventListener('click', ()=>go(-1));
document.getElementById('btnNext').addEventListener('click', ()=>go(1));
document.addEventListener('keydown', e=>{
  if(e.key === 'ArrowRight') go(1);
  else if(e.key === 'ArrowLeft') go(-1);
});

renderNarrative();
</script>

</body>
</html>
