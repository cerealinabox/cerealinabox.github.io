<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0B1220">
<title>Children's Emergency — Journey narrative</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#142238;
  --now:#F4A417;
  --font-body:'IBM Plex Sans',system-ui,-apple-system,sans-serif;
  --font-mono:'IBM Plex Mono',ui-monospace,SFMono-Regular,monospace;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{
  font-family:var(--font-body);
  background:radial-gradient(120% 90% at 50% 0%,#20304A 0%,#0B1220 62%);
  color:var(--ink);line-height:1.5;font-size:16px;
  min-height:100vh;overflow-x:hidden;overflow-y:auto;
}
button{font:inherit;color:inherit;background:none;border:none;cursor:pointer}
.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

/* ---------- single-column stage: narrative only ---------- */
.stage{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:48px 32px;box-sizing:border-box;}
.narrative{width:min(620px,92vw);flex-shrink:0;}
.narr-photo-wrap{position:relative;width:100%;aspect-ratio:16/9;border-radius:18px;overflow:hidden;background:#0F1826;box-shadow:0 24px 60px rgba(0,0,0,.5),inset 0 0 0 1px rgba(255,255,255,.06);}
.narr-photo{width:100%;height:100%;object-fit:cover;display:block;transition:opacity .35s ease;}
.narr-photo-ph{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:#6B7A90;font-family:var(--font-mono);font-size:12px;letter-spacing:.06em;padding:20px;text-align:center;}
.narr-body{margin-top:22px;}
.narr-step{display:block;font-family:var(--font-mono);font-size:11px;font-weight:600;letter-spacing:.15em;text-transform:uppercase;color:var(--now);}
.narr-head{display:flex;align-items:center;gap:10px;flex-wrap:wrap;}
.chip-cp{font-family:var(--font-mono);font-size:9.5px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;color:rgba(255,255,255,.72);border:1px solid rgba(255,255,255,.28);border-radius:99px;padding:3px 8px;}
.chip-cp[hidden]{display:none}
.narr-meta{display:block;margin-top:9px;font-family:var(--font-mono);font-size:10.5px;letter-spacing:.07em;text-transform:uppercase;color:#8FA1B8;}
.narr-meta:empty{display:none}
.narr-text{margin-top:14px;font-size:16.5px;line-height:1.62;color:#E9EEF4;font-weight:400;}

/* ---------- narrative controls ---------- */
.controls{margin-top:26px;display:flex;align-items:center;gap:7px;background:var(--ink);border-radius:99px;padding:7px;box-shadow:0 12px 34px rgba(20,34,56,.42)}
.ctrl{border-radius:99px;padding:0 16px;min-height:42px;font-weight:600;font-size:14.5px;white-space:nowrap;background:rgba(255,255,255,.15);color:#fff;transition:opacity .18s,background .18s}
.ctrl:disabled{opacity:.28;cursor:not-allowed}
.ctrl.primary{background:var(--now);color:#3A2A00}
.ctrl.primary:disabled{background:rgba(255,255,255,.15);color:#fff}
.ctrl:focus-visible{outline:2px solid var(--now);outline-offset:2px}
.ctrl-hint{flex:1;min-width:0;text-align:center;font-size:10.5px;font-weight:500;line-height:1.25;color:rgba(255,255,255,.62)}

@media(max-width:920px){
  .stage{padding:24px 16px;}
  .narr-text{font-size:15.5px;}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>

<div class="stage">

<aside class="narrative" id="narrative">
  <div class="narr-photo-wrap">
    <img class="narr-photo" id="narrPhoto" alt="">
    <span class="narr-photo-ph" id="narrPhotoPh" hidden></span>
  </div>
  <div class="narr-body">
    <div class="narr-head">
      <span class="narr-step" id="narrStep"></span>
      <span class="chip-cp" id="narrCp" hidden>Checkpoint</span>
    </div>
    <span class="narr-meta" id="narrMeta"></span>
    <p class="narr-text" id="narrText"></p>
  </div>

  <div class="controls">
    <button class="ctrl" id="btnBack">Back</button>
    <span class="ctrl-hint" id="ctrlHint"></span>
    <button class="ctrl primary" id="btnNext">Next</button>
  </div>
</aside>

</div>

<script>
/* Narrative frames — Scene 1 to Scene 8. Photos sit beside this file: photo1.jpeg … photo8.jpeg
   cp:true marks a checkpoint scene. */
const PHOTO_EXTS = ['.jpeg', '.jpg', '.png', '.webp'];   /* tried in order */

const NARR = [
 {"n": "Scene 1", "label": "Arrival screening", "photo": 1, "time": "8:00 a.m.", "place": "KKH Children’s Emergency Entrance", "cp": false, "text": "The journey begins at 8:00 a.m. The mother and her six-year-old child arrive at the hospital entrance. The child, pale and visibly weak from hours of vomiting, clings to the mother. They join a short queue outside the main doors. A nurse, wearing protective gear, approaches them to begin the mandatory screening questionnaire regarding recent travel and potential exposure to contagious diseases. The morning light is cool, and the atmosphere is quiet but anxious."},
 {"n": "Scene 2", "label": "Triage waiting", "photo": 2, "time": "8:45 a.m.", "place": "Triage Waiting Area", "cp": true, "text": "Forty-five minutes later, they have moved inside the hospital to the main Children’s Emergency triage waiting area. The mother holds a queue number (‘B124’) while seated in a busy, sterile room filled with other waiting families. The environment is warm and bright. The child, pale and defined as weak in Scene 1, rests their head on the mother’s lap, looking extremely uneasy. A passing staff member has just handed the child a small yellow bowl, as the child is vomiting intermittently while they wait to be called by the triage nurse."},
 {"n": "Scene 3", "label": "Payment and first vomit", "photo": 3, "time": "", "place": "Registration / Payment Counter", "cp": false, "text": "Following triage, they are directed to the administrative counter. While the mother is distracted attempting to make payment, the child, overwhelmed by nausea, suddenly vomits directly onto the linoleum floor next to the counter for the first time inside the department. The scene captures the distress and mess. One nurse immediately steps forward, maintaining the same uniform style seen in previous scenes, and hands the mother a clean blue emesis bag. Another staff member is already approaching with a yellow cleaning cart in the background."},
 {"n": "Scene 4", "label": "Doctor wait", "photo": 4, "time": "11:30 a.m. · 3.5 hours since arrival", "place": "Main Waiting Hall", "cp": true, "text": "The hours drag on. They are now in a massive, extremely crowded waiting hall, much larger than the area in Scene 2. The mother looks completely exhausted, rubbing her temples and checking her watch. The clock on the wall shows 11:30 a.m., emphasizing the long wait. The weak child is curled up, asleep on the mother’s lap, still clutching the blue emesis bag. The hall is packed with other families, creating an environment heavy with fatigue and distress under persistent fluorescent lights."},
 {"n": "Scene 5", "label": "Blood test delay", "photo": 5, "time": "", "place": "Procedure / Blood Draw Room", "cp": false, "text": "Finally, the child is seen by a doctor and a blood test is ordered. They move to a small, dedicated procedure room. The child, still weak and pale, is seated while a compassionate nurse inserts a butterfly needle into their arm. The child grimaces and turns away, squeezing the mother’s hand. Crucially, on a small side table next to the medical equipment, an emesis bowl containing fresh vomit is visible, confirming that the child vomited again while waiting for this procedure. The blue bag is still close by."},
 {"n": "Scene 6", "label": "Diagnosis and admission", "photo": 6, "time": "", "place": "Consultation Room", "cp": false, "text": "After another long wait for results, they are called into a clean, well-lit consultation room. A pediatrician in a white coat sits opposite the mother and child. The doctor reviews data on a computer screen and delivers the diagnosis: a severe Rotavirus infection. The mother looks serious and focused, holding the official ‘ADMISSION LETTER’ envelope and a small bottle of anti-nausea medicine the doctor just provided. The weak child is slumped in a chair, exhausted. The blue emesis bag remains visible on the desk, a constant reminder of the illness."},
 {"n": "Scene 7", "label": "Admission wait", "photo": 7, "time": "", "place": "Admissions Lobby / Pharmacy", "cp": true, "text": "The setting shifts to the main Admissions and Pharmacy lobby, which is described as severely crowded, hot, and difficult to navigate. The environment is chaotic and humid, with warm, dim lighting. The mother and child are standing, squeezed tightly between other families and stacks of luggage; there are absolutely no seats available. The child is completely slumped against the mother’s leg, too exhausted to stand. An admissions counter is visible, where a clerk is briefing a standing parent. The mother watches a queue monitor (‘Now Serving: A105’) nervously, holding ticket A130."},
 {"n": "Scene 8", "label": "Bed assignment", "photo": 8, "time": "", "place": "Admissions Counter", "cp": true, "text": "This is the final scene. The setting remains the crowded admissions counter from Scene 7. The mother is at the counter, looking very frustrated and pointing to her smartphone, which is dark. The stressed clerk (the same clerk from Scene 7) apologetically points to a computer screen that clearly displays ‘CALL MISSED’. The weak child is slumped, sleeping on a nearby wooden bench. The mother realizes the system failed to notify her over the noisy environment. However, the clerk is now typing the final information and handing the mother a slip that reads ‘WARD 7D, BED 22’, verbally confirming the bed is finally ready. A porter waits nearby with a wheelchair."}
];
let narr = 0;

function renderNarrative(){
  const f = NARR[narr];
  const img = document.getElementById('narrPhoto');
  const ph = document.getElementById('narrPhotoPh');
  if(img){
    let tryExt = 0;
    img.style.opacity = 0;
    img.onload = ()=>{ img.style.opacity = 1; if(ph) ph.hidden = true; };
    img.onerror = ()=>{
      if(++tryExt < PHOTO_EXTS.length){ img.src = 'photo' + f.photo + PHOTO_EXTS[tryExt]; return; }
      img.style.opacity = 0;
      if(ph){ ph.hidden = false; ph.textContent = 'Photo ' + f.photo + ' \u2014 add photo' + f.photo + PHOTO_EXTS[0] + ' next to this file'; }
    };
    if(ph) ph.hidden = true;
    img.src = 'photo' + f.photo + PHOTO_EXTS[0];
  }
  const step = document.getElementById('narrStep');
  const meta = document.getElementById('narrMeta');
  const cp   = document.getElementById('narrCp');
  const text = document.getElementById('narrText');
  if(step) step.textContent = f.n + ' \u00B7 ' + f.label;
  if(cp) cp.hidden = !f.cp;
  if(meta) meta.textContent = [f.time, f.place].filter(Boolean).join(' \u2014 ');
  if(text) text.textContent = f.text;

  document.getElementById('btnBack').disabled = narr === 0;
  document.getElementById('btnNext').disabled = narr === NARR.length - 1;
  document.getElementById('ctrlHint').textContent =
    (narr + 1) + ' of ' + NARR.length + (narr === NARR.length - 1 ? ' \u00B7 End of the journey' : '');
}

function go(delta){
  const n = narr + delta;
  if(n < 0 || n > NARR.length - 1) return;
  narr = n;
  renderNarrative();
}

document.getElementById('btnBack').addEventListener('click', ()=>go(-1));
document.getElementById('btnNext').addEventListener('click', ()=>go(1));
document.addEventListener('keydown', e=>{
  if(e.key === 'ArrowRight') go(1);
  else if(e.key === 'ArrowLeft') go(-1);
});

renderNarrative();
</script>

</body>
</html>
